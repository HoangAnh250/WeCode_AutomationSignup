name: wecode-backend-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wecode
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-wecode}
      POSTGRES_DB: wecode
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecode -d wecode"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
